# DT4MOB — Wildfire Digital Twin
# Compatible with: docker compose v2 and podman-compose
# SELinux: all host-path bind mounts use :z (shared relabelling)
# Podman note: if using rootless podman, ensure subuid/subgid are configured.

name: dt4mob

services:
