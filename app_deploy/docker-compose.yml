  # ── Ingestion / FastAPI ──────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    image: atnog-harbor.av.it.pt/dt4mob/dt4mob-fire-simulator:latest
    restart: unless-stopped
    env_file: .env
    # depends_on:
    #   prepare_rasters_job:
    #     condition: service_completed_successfully
    volumes:
      - ./data:/data:z
    network_mode: host

